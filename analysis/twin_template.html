<title>East Metro Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #f4f6f5; --panel: rgba(255, 255, 255, .94); --panel-solid: #ffffff; --ink: #142120; --ink-2: #4c5b59; --ink-3: #75817f;
  --line: #d8dfdd; --line-2: #e8edeb; --accent: #0e6a62; --accent-soft: #dcefeb; --below: #0e7c70; --above: #c2413b; --ref: #8a9593;
  --warn-bg: #fdf1d8; --warn-ink: #7a4b00; --shadow: 0 2px 6px rgba(20, 33, 32, .08), 0 12px 32px rgba(20, 33, 32, .12);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif; --body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --paper: #121817; --panel: rgba(26, 33, 32, .93); --panel-solid: #1a2120; --ink: #eef3f2; --ink-2: #b3bfbd; --ink-3: #8a9795; --line: #2f3a38; --line-2: #243030; --accent: #5cc4b7; --accent-soft: #1d3633; --below: #4fc0b2; --above: #ec7b74; --ref: #7d8987; --warn-bg: #3a2e14; --warn-ink: #f2c46b; --shadow: 0 2px 10px rgba(0, 0, 0, .4); }
}
:root[data-theme="dark"] { color-scheme: dark; --paper: #121817; --panel: rgba(26, 33, 32, .93); --panel-solid: #1a2120; --ink: #eef3f2; --ink-2: #b3bfbd; --ink-3: #8a9795; --line: #2f3a38; --line-2: #243030; --accent: #5cc4b7; --accent-soft: #1d3633; --below: #4fc0b2; --above: #ec7b74; --ref: #7d8987; --warn-bg: #3a2e14; --warn-ink: #f2c46b; --shadow: 0 2px 10px rgba(0, 0, 0, .4); }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.panel { position: absolute; background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
header.bar { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 10px 14px; }
header.bar h1 { margin: 0; font: 800 22px/1 var(--display); font-stretch: 78%; letter-spacing: -.01em; }
header.bar .sub { font-size: 12.5px; color: var(--ink-2); }
header.bar .views { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.chip { font: 500 12.5px var(--body); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink-2); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel-solid); }
#controls { top: calc(84px + env(safe-area-inset-top, 0px)); left: 12px; width: 268px; max-height: calc(100% - 110px); overflow-y: auto; padding: 14px; display: grid; gap: 14px; }
#info { top: calc(84px + env(safe-area-inset-top, 0px)); right: 12px; width: 300px; max-height: calc(100% - 110px); overflow-y: auto; padding: 14px; display: grid; gap: 10px; }
.lab { font: 500 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.grp { display: grid; gap: 6px; }
select, input[type=number] { font: 500 13.5px var(--body); color: var(--ink); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }
.legend { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 7px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.top-list { display: grid; gap: 4px; }
.top-list button { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; text-align: left; font: inherit; font-size: 12.5px; color: var(--ink); background: none; border: 0; border-radius: 6px; padding: 5px 6px; cursor: pointer; }
.top-list button:hover { background: var(--line-2); }
.badge { display: inline-grid; place-items: center; height: 22px; min-width: 30px; border-radius: 5px; font: 800 13px var(--display); color: #2a1d05; }
h2 { margin: 0; font: 800 18px/1.15 var(--display); font-stretch: 85%; text-wrap: balance; }
.sub2 { font-size: 12.5px; color: var(--ink-3); }
.attrs { display: grid; gap: 5px; }
.attrs div { display: grid; grid-template-columns: 36px 1fr 28px; gap: 8px; align-items: center; font: 600 12px var(--display); letter-spacing: .04em; }
.attrs em { display: block; height: 7px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
.attrs em i { display: block; height: 100%; background: var(--accent); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--ink-3); } dl.kv dd { margin: 0; }
.btn { display: inline-block; font: 600 13px var(--body); padding: 7px 12px; border-radius: 8px; background: var(--accent); color: var(--panel-solid); text-decoration: none; border: 0; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); margin: 1px 2px 1px 0; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; max-width: 260px; z-index: 5; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); z-index: 10; }
#loading div { display: grid; gap: 10px; justify-items: center; font-size: 14px; color: var(--ink-2); }
#loading .bar { width: 220px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.hint { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 6px 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.toggle-panels { display: none; }
@media (max-width: 820px) {
  #controls, #info { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; width: auto; max-height: 46%; }
  #controls[hidden], #info[hidden] { display: none; }
  .toggle-panels { display: inline-flex; gap: 4px; }
  header.bar .views { margin-left: 0; flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; }
  header.bar .views .chip { flex: none; }
  header.bar .sub { font-size: 11.5px; }
  .hint { display: none; }
}
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div id="stage"></div>
<div id="loading"><div><b style="font: 800 20px var(--display)">East Metro Twin</b><span id="load-msg">Loading the city…</span><span class="bar"><i id="load-bar"></i></span></div></div>

  <div class="grp"><label class="lab" for="c-height">Pillar height</label>
    <select id="c-height"><option value="price">Asking price</option><option value="ovr">Overall rating</option><option value="psf">Price per sqft</option><option value="flat">Same height</option></select></div>
  <div class="grp"><label class="lab" for="c-ex">Terrain height</label>
    <select id="c-ex"><option value="1">True scale</option><option value="1.5">1.5× exaggerated</option><option value="2.5">2.5× exaggerated</option><option value="0">Flat</option></select></div>
  <div class="legend" id="legend"></div>
  <div class="grp"><span class="lab">Layers</span>
    <label class="check"><input type="checkbox" id="l-bld" checked> 3D buildings</label>
    <label class="check"><input type="checkbox" id="l-walk" checked> Walkability heat</label>
    <label class="check"><input type="checkbox" id="l-sch" checked> Schools</label>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { MapControls } from "three/addons/controls/MapControls.js";

const DASHBOARD = "https://claude.ai/artifact/SZSfz3J35ByoZzYaTyFApA";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt$ = v => v == null ? "—" : "$" + Math.round(v).toLocaleString("en-CA");
const fmtK = v => v == null ? "—" : v >= 999500 ? "$" + (v / 1e6).toFixed(2) + "M" : "$" + Math.round(v / 1000) + "K";
const pct = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";
const progress = (f, msg) => { $("#load-bar").style.width = Math.round(f * 100) + "%"; if (msg) $("#load-msg").textContent = msg; };

/* ---------- Load assets ---------- */
function webglOK() { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch { return false; } }
if (!webglOK()) { $("#load-msg").textContent = "This device can't show 3D graphics (WebGL is off). Open the dashboard for the 2D map instead."; throw new Error("no webgl"); }
progress(.1, "Loading listings and analysis…");
const DATA = await (await fetch("twin_data.json")).json();
progress(.3, "Loading 15,000 buildings…");
const BIN = (() => { return fetch("buildings.json").then(r => r.json()).then(j => { const s = atob(j.b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new DataView(a.buffer); }); })();
const BINV = await BIN;
progress(.55, "Loading the ground map…");
const texLoader = new THREE.TextureLoader();
const [groundTex, walkTex, terrTex] = await Promise.all(["ground.png", "walk.png", "terrain.png"].map(u => texLoader.loadAsync(u)));
progress(.75, "Building the city…");

const L = DATA.listings, WORLD = DATA.world;
$("#scan").textContent = `${L.length} listings from the ${new Date(DATA.latest_scan + "T12:00:00").toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" })} scan · ${DATA.schools.length} schools · ${BINV.getUint32(0, true).toLocaleString()} 3D buildings`;

/* ---------- Ratings (same as the dashboard's scorecards, default weights) ---------- */
const HARD = new Set(["leasehold", "resale not established", "third-bedroom integrity conflict", "adult oriented"]);
const restricted = l => (l.flags || []).some(f => HARD.has(f)) || /Leasehold|Undivided/.test(l.tenure || "");
const rankPct = vals => { const s = [...vals].sort((a, b) => a - b); return v => s.length > 1 ? s.filter(x => x < v).length / (s.length - 1) : .5; };
const sqftPct = rankPct(L.map(l => l.sqft)), locPct = rankPct(L.map(l => l.loc_prem));
const clampR = v => Math.round(Math.max(35, Math.min(99, v)));
const W = { VAL: 5, SPC: 3, SCH: 4, WLK: 3, LOC: 2, BLD: 3 };
for (const l of L) {
  const age = l.year != null ? 2026 - l.year : null;
  let bld = age != null ? Math.max(0, Math.min(100, 100 - age * 1.6)) : 50;
  if (l.lux != null) bld = .6 * bld + .4 * l.lux * 10;
  if (l.leaky_era) bld -= 12;
  l.attr = { VAL: clampR(70 - l.gap * 1.5), SPC: clampR(45 + 54 * sqftPct(l.sqft)), SCH: clampR(40 + .59 * (l.school_score ?? 50)),
             WLK: clampR(40 + .59 * (l.walk ?? 50)), LOC: clampR(45 + 54 * locPct(l.loc_prem)), BLD: clampR(40 + .59 * bld) };
  const tw = Object.values(W).reduce((a, b) => a + b, 0);
  l.ovr = Math.round(Object.entries(W).reduce((s, [k, w]) => s + w * l.attr[k], 0) / tw);
  l.tier = !restricted(l) && l.gap <= -15 ? "special" : l.ovr >= 80 ? "gold" : l.ovr >= 70 ? "silver" : "bronze";
}
const TIER = { special: "#0f7a6e", gold: "#e3b43c", silver: "#b9c3ca", bronze: "#c98a52" };

/* ---------- Scene ---------- */
const stage = $("#stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color("#dfe9ec");
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 60000, 160000);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 5, 150000);
const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = Math.PI * .47; controls.minDistance = 150; controls.maxDistance = 60000;
controls.screenSpacePanning = false;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c4c0, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-8000, 14000, 6000); scene.add(sun);

// Water and ground
const water = new THREE.Mesh(new THREE.PlaneGeometry(400000, 400000), new THREE.MeshBasicMaterial({ color: "#b2cdd6" }));
water.rotation.x = -Math.PI / 2; water.position.y = -80; scene.add(water);
/* ---------- Terrain (NRCan CDEM / SRTM via AWS terrain tiles) ---------- */
const T = DATA.terrain;
const HGT = (() => {
  const img = terrTex.image, c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, img.width, img.height).data, out = new Float32Array(img.width * img.height);
  for (let i = 0; i < out.length; i++) out[i] = (d[i * 4] * 256 + d[i * 4 + 1]) / 10 - 50;
  return out;
})();
let EX = 1;  // vertical exaggeration
function rawHeight(x, z) {
  const fx = (x - T.x0) / (T.x1 - T.x0) * (T.nx - 1), fz = (z - T.z0) / (T.z1 - T.z0) * (T.nz - 1);
  if (fx < 0 || fz < 0 || fx > T.nx - 1 || fz > T.nz - 1) return 0;
  const i = Math.min(Math.floor(fx), T.nx - 2), j = Math.min(Math.floor(fz), T.nz - 2), u = fx - i, v = fz - j;
  const h = HGT[j * T.nx + i] * (1 - u) * (1 - v) + HGT[j * T.nx + i + 1] * u * (1 - v) + HGT[(j + 1) * T.nx + i] * (1 - u) * v + HGT[(j + 1) * T.nx + i + 1] * u * v;
  return Math.max(0, h);
}
const ground = (x, z) => rawHeight(x, z) * EX;
groundTex.colorSpace = THREE.SRGBColorSpace; groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
walkTex.colorSpace = THREE.SRGBColorSpace;
const terrGeo = new THREE.PlaneGeometry(T.x1 - T.x0, T.z1 - T.z0, T.nx - 1, T.nz - 1);
terrGeo.rotateX(-Math.PI / 2); terrGeo.translate((T.x0 + T.x1) / 2, 0, (T.z0 + T.z1) / 2);
{
  const P = terrGeo.attributes.position, uv = terrGeo.attributes.uv, col = new Float32Array(P.count * 3), elev = new Float32Array(P.count), c = new THREE.Color();
  const RAMP = [[0, "#b2cdd6"], [1, "#d6dccb"], [120, "#bfcfae"], [400, "#9fb68f"], [800, "#7f9674"], [1200, "#9a9a8e"], [1500, "#d9d9d3"]];
  for (let i = 0; i < P.count; i++) {
    const x = P.getX(i), z = P.getZ(i), h = HGT[i];  // PlaneGeometry vertex order matches the heightmap (north row first)
    const u = (x - T.bbox_x0) / (T.bbox_x1 - T.bbox_x0), v = 1 - (z - T.bbox_z0) / (T.bbox_z1 - T.bbox_z0);
    uv.setXY(i, u, v);
    elev[i] = Math.max(0, h);
    { let k = RAMP.length - 1; while (k > 0 && h < RAMP[k][0]) k--; const [h0, c0] = RAMP[k], nxt = RAMP[Math.min(k + 1, RAMP.length - 1)]; c.set(c0); if (nxt[0] > h0) c.lerp(new THREE.Color(nxt[1]), Math.min(1, Math.max(0, (h - h0) / (nxt[0] - h0)))); if (h <= 0.5) c.set("#b2cdd6"); }
    col.set([c.r, c.g, c.b], i * 3);
  }
  terrGeo.setAttribute("rampColor", new THREE.BufferAttribute(col, 3));
  terrGeo.setAttribute("elev", new THREE.BufferAttribute(elev, 1));
}
function applyTerrainHeights() {
  const P = terrGeo.attributes.position;
  for (let i = 0; i < P.count; i++) P.setY(i, Math.max(0, HGT[i]) * EX);
  P.needsUpdate = true; terrGeo.computeVertexNormals();
}
applyTerrainHeights();
const terrUniforms = { walkMap: { value: walkTex }, walkOn: { value: 1 } };
// Inside the study area the street map is draped on the terrain and fades into natural colours on high ground
// (forested slopes, peaks); outside it the terrain is coloured by elevation only.
const terrMat = new THREE.MeshLambertMaterial({ map: groundTex });
terrMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, terrUniforms);
  sh.vertexShader = "attribute vec3 rampColor; attribute float elev; varying vec3 vRamp; varying float vElev;\n" + sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\n vRamp = rampColor; vElev = elev;");
  sh.fragmentShader = "uniform sampler2D walkMap; uniform float walkOn; varying vec3 vRamp; varying float vElev;\n" + sh.fragmentShader.replace("#include <map_fragment>", `
    #ifdef USE_MAP
      bool inside = all(greaterThanEqual(vMapUv, vec2(0.0))) && all(lessThanEqual(vMapUv, vec2(1.0)));
      vec3 ramp = pow(vRamp, vec3(2.2));
      if (inside) {
        vec4 g = texture2D(map, vMapUv);
        vec4 w = texture2D(walkMap, vMapUv);
        g.rgb = mix(g.rgb, w.rgb, w.a * 0.6 * walkOn);
        diffuseColor.rgb *= mix(g.rgb, ramp, smoothstep(140.0, 420.0, vElev));
      } else {
        diffuseColor.rgb *= ramp;
      }
    #endif`);
};
const terrain = new THREE.Mesh(terrGeo, terrMat); scene.add(terrain);
const walkLayer = { get visible() { return terrUniforms.walkOn.value > 0; }, set visible(v) { terrUniforms.walkOn.value = v ? 1 : 0; } };

// Buildings: walls + roofs merged into one mesh, darker at the base for depth.
function buildCity() {
  // Each building sits on the terrain: walls start at the lowest ground under its corners, roof height is above its centre.
  const n = BINV.getUint32(0, true);
  let off = 4;
  const pos = [], col = [];
  const cBase = new THREE.Color("#b9bdb9"), cTop = new THREE.Color("#fbfbf8"), cTall = new THREE.Color("#e9eef0"), tmp = new THREE.Color();
  for (let b = 0; b < n; b++) {
    const k = BINV.getUint16(off, true), h = BINV.getUint16(off + 2, true) / 10; off += 4;
    const pts = [];
    for (let i = 0; i < k; i++) { pts.push(new THREE.Vector2(BINV.getInt16(off, true), BINV.getInt16(off + 2, true))); off += 4; }
    const roof = tmp.copy(cTop).lerp(cTall, Math.min(h / 120, 1));
    let base = Infinity, cx = 0, cz = 0;
    for (const p of pts) { base = Math.min(base, ground(p.x, p.y)); cx += p.x / k; cz += p.y / k; }
    base -= 1; const top = ground(cx, cz) + h;
    for (let i = 0; i < k; i++) {
      const a = pts[i], c = pts[(i + 1) % k];
      pos.push(a.x, base, a.y, c.x, base, c.y, c.x, top, c.y, a.x, base, a.y, c.x, top, c.y, a.x, top, a.y);
      for (const top of [0, 0, 1, 0, 1, 1]) { const cc = top ? roof : cBase; col.push(cc.r, cc.g, cc.b); }
    }
    let tris;
    try { tris = THREE.ShapeUtils.triangulateShape(pts, []); } catch { tris = []; }
