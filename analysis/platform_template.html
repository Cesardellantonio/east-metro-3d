<title>Two Keys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --glass: rgba(255,255,255,.9); --paper: #ffffff; --paper-2: #f4f7f6; --ink: #11272c; --ink-2: #4a5f63; --ink-3: #7b8c8f; --line: #d5dfdd;
  --brass: #a8741a; --brass-2: #c9973d; --brass-soft: #f4e8cc; --pine: #22614f; --pine-soft: #dcefe8; --rose: #a8414f; --rose-soft: #f6e1e4;
  --sky: #2c6a93; --sky-soft: #deebf4; --shadow: 0 2px 6px rgba(17,39,44,.08), 0 18px 44px rgba(17,39,44,.16);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif; --body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; --paper-bg: #e7eeec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --glass: rgba(21,36,39,.9); --paper: #152427; --paper-2: #1b2d30; --ink: #e7eeed; --ink-2: #aebdbd; --ink-3: #82938f; --line: #2c3f42;
    --brass: #dcaa4a; --brass-2: #e9bd65; --brass-soft: #3a2f17; --pine: #56b89a; --pine-soft: #183a31; --rose: #e27e8d; --rose-soft: #3d2227; --sky: #6fb0dc; --sky-soft: #173042;
    --shadow: 0 2px 10px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.35); --paper-bg: #0e1a1c; }
}
:root[data-theme="dark"] { color-scheme: dark; --glass: rgba(21,36,39,.9); --paper: #152427; --paper-2: #1b2d30; --ink: #e7eeed; --ink-2: #aebdbd; --ink-3: #82938f; --line: #2c3f42;
  --brass: #dcaa4a; --brass-2: #e9bd65; --brass-soft: #3a2f17; --pine: #56b89a; --pine-soft: #183a31; --rose: #e27e8d; --rose-soft: #3d2227; --sky: #6fb0dc; --sky-soft: #173042;
  --shadow: 0 2px 10px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.35); --paper-bg: #0e1a1c; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper-bg); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--sky); }
:focus-visible { outline: 3px solid var(--brass-2); outline-offset: 2px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .small { font-size: 13.5px; } .tiny { font-size: 12px; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }

/* Top bar */
#bar { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; z-index: 10; display: flex; align-items: center; gap: 10px 18px; padding: 8px 10px 8px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand h1 { font-size: 22px; font-weight: 800; white-space: nowrap; }
.brand svg { width: 34px; height: 22px; }
#modes { display: flex; gap: 2px; background: var(--paper-2); border-radius: 12px; padding: 3px; overflow-x: auto; scrollbar-width: none; }
#modes button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
#modes button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
#modes .count { font: 500 11px var(--mono); background: var(--brass-soft); color: var(--brass); padding: 1px 6px; border-radius: 999px; margin-left: 4px; }
#modes .count:empty { display: none; }
#people { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.face { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--c, var(--line)); object-fit: cover; background: var(--paper); flex: none; }
.face.ghost { border-style: dashed; display: inline-grid; place-items: center; font-size: 12px; color: var(--ink-3); }

/* Left rail */
#rail { position: fixed; z-index: 9; top: calc(76px + env(safe-area-inset-top, 0px)); left: 12px; width: 286px; max-height: calc(100% - 100px); overflow-y: auto; padding: 14px; display: grid; gap: 14px; align-content: start; }
.lab { font: 500 11.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 5px; }
.lenses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.lenses button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 7px 4px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.lenses button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.legend { display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 7px; }
.legend i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
.check input { accent-color: var(--brass); width: 15px; height: 15px; }
input[type=number], input[type=date], textarea, select { width: 100%; font: 14.5px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
textarea { resize: vertical; min-height: 58px; }
.toplist { display: grid; gap: 2px; }
.toplist button { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; text-align: left; border: 0; background: none; border-radius: 10px; padding: 6px; cursor: pointer; font-size: 13px; }
.toplist button:hover { background: var(--paper-2); }
.badge { display: inline-grid; place-items: center; height: 22px; min-width: 30px; border-radius: 6px; font: 800 12.5px var(--display); color: #fff; }

/* Right card */
#card { position: fixed; z-index: 9; top: calc(76px + env(safe-area-inset-top, 0px)); right: 12px; width: 392px; max-height: calc(100% - 100px); overflow-y: auto; }
.card-in { padding: 18px; display: grid; gap: 14px; }
.home-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.home-head h2 { font-size: 24px; font-weight: 750; line-height: 1.1; }
.xbtn { border: 0; background: var(--paper-2); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
.pill.good { background: var(--pine-soft); color: var(--pine); } .pill.warn { background: var(--brass-soft); color: var(--brass); } .pill.bad { background: var(--rose-soft); color: var(--rose); }
.price-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.price-line .ask { font: 800 32px/1 var(--display); }
.price-line .mo { font: 700 16px var(--display); color: var(--ink-2); }
.verdict { font-weight: 700; } .verdict.good { color: var(--pine); } .verdict.bad { color: var(--rose); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 10px; border-radius: 12px; background: var(--paper-2); }
.fact svg { width: 22px; height: 22px; color: var(--sky); }
.fact b { display: block; font-size: 13.5px; line-height: 1.25; }
.fact span { font-size: 12px; color: var(--ink-2); line-height: 1.3; display: block; }
.reasons { display: grid; gap: 10px; }
.reasons h3 { font-size: 14.5px; }
.reasons ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
.reasons .yes h3 { color: var(--pine); } .reasons .no h3 { color: var(--rose); }
.attrs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.attrs div { display: grid; justify-items: center; gap: 2px; font: 700 11px var(--mono); color: var(--ink-3); }
.attrs b { font: 800 18px var(--display); color: var(--ink); }
.vote-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.vote { display: grid; justify-items: center; gap: 2px; padding: 10px 4px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); cursor: pointer; font-weight: 700; font-size: 13.5px; }
.vote svg { width: 30px; height: 20px; }
.vote kbd { font: 500 10.5px var(--mono); color: var(--ink-3); }
.vote.love { color: var(--pine); } .vote.maybe { color: var(--sky); } .vote.pass { color: var(--rose); }
.vote[aria-pressed="true"].love { background: var(--pine-soft); border-color: var(--pine); }
.vote[aria-pressed="true"].maybe { background: var(--sky-soft); border-color: var(--sky); }
.vote[aria-pressed="true"].pass { background: var(--rose-soft); border-color: var(--rose); }
.keyturn { transition: transform .45s cubic-bezier(.2,.9,.3,1.3); transform-origin: 9px 11px; }
.vote[aria-pressed="true"].love .keyturn { transform: rotate(90deg); }
.partner-box { border-radius: 12px; padding: 12px; border: 1px dashed var(--line); display: grid; gap: 4px; font-size: 13.5px; }
.partner-box .who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.partner-box.both { border: 2px solid var(--pine); background: var(--pine-soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 11px; border: 1px solid var(--line); background: var(--paper); padding: 8px 13px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.steps { display: grid; gap: 5px; }
.step { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
.step input { width: 17px; height: 17px; accent-color: var(--pine); margin-top: 1px; flex: none; }
.step.done span { text-decoration: line-through; color: var(--ink-3); }
.intro { display: grid; gap: 12px; }
.intro .big { font: 800 26px/1.1 var(--display); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 10px; border-radius: 12px; background: var(--paper-2); display: grid; gap: 2px; }
.stat b { font: 800 24px/1 var(--display); }
.stat span { font-size: 12px; color: var(--ink-2); line-height: 1.25; }

/* Sheets (picks / priorities / report) */
#sheet { position: fixed; z-index: 12; top: calc(76px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(820px, calc(100% - 24px)); max-height: calc(100% - 96px); overflow-y: auto; }
.sheet-in { padding: 24px; display: grid; gap: 18px; }
.sheet-in h2 { font-size: clamp(24px, 3.6vw, 34px); font-weight: 750; line-height: 1.1; }
.sheet-close { position: sticky; top: 0; float: right; margin: 10px 10px 0 0; z-index: 2; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }
.pick { border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; background: var(--paper); }
.pick-head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.two-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.note { border-radius: 10px; padding: 8px 10px; background: var(--paper-2); border-left: 4px solid var(--c, var(--line)); font-size: 13.5px; }
.note .who { font-weight: 700; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.vote-dot { display: inline-block; font: 700 11px var(--body); padding: 1px 7px; border-radius: 999px; }
.vote-dot.love { background: var(--pine-soft); color: var(--pine); } .vote-dot.maybe { background: var(--sky-soft); color: var(--sky); } .vote-dot.pass { background: var(--rose-soft); color: var(--rose); } .vote-dot.none { background: var(--paper-2); color: var(--ink-3); }
.row-home { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.prio { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 760px) { .prio { grid-template-columns: 1fr; } }
.slider { display: grid; gap: 3px; }
.slider .top { display: flex; justify-content: space-between; font-size: 14px; }
.slider input { width: 100%; accent-color: var(--brass); }
.slider .theirs { font: 500 11.5px var(--mono); color: var(--ink-3); }
.hex { width: 100%; max-width: 320px; height: auto; justify-self: center; }
.hex text { font: 700 11.5px var(--body); fill: var(--ink-2); }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.letter p { font-size: 16.5px; line-height: 1.6; max-width: 66ch; }
.letter { display: grid; gap: 16px; }
.pull { font: 700 20px/1.3 var(--display); border-left: 4px solid var(--brass); padding-left: 14px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 130px 1fr 56px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar em { display: block; height: 10px; border-radius: 5px; background: var(--line); position: relative; }
.bar em i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }

/* Tour bar, map furniture */
#tour { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
#tour .prog { width: 160px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
#tour .prog i { display: block; height: 100%; background: var(--brass); }
#furniture { position: fixed; z-index: 8; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: flex-end; }
#compass { width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; }
#compass svg { width: 40px; height: 40px; transition: transform .08s linear; }
#scalebar { padding: 6px 10px; display: grid; gap: 3px; font: 500 11px var(--mono); color: var(--ink-2); }
#scalebar i { display: block; height: 6px; border: 2px solid var(--ink-2); border-top: 0; }
#light { padding: 6px; display: flex; gap: 2px; border-radius: 12px; }
#light button { border: 0; background: none; padding: 5px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
#light button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--paper-bg); padding: 7px 10px; border-radius: 9px; font-size: 12.5px; max-width: 260px; }
#toast { position: fixed; z-index: 30; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper-bg); padding: 9px 15px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); }
#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--paper-bg); }
#loading .box { display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }
#loading .bar2 { width: 220px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
#loading .bar2 i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .2s; }
#sync { position: fixed; z-index: 11; left: 50%; transform: translateX(-50%); top: calc(76px + env(safe-area-inset-top, 0px)); padding: 8px 14px; font-size: 13px; max-width: min(560px, calc(100% - 24px)); text-align: center; }
@media (max-width: 820px) { #sync { top: calc(118px + env(safe-area-inset-top, 0px)); } }
#mobilebar { display: none; }
body.public .homes-only { display: none !important; }
.school-card { display: grid; gap: 12px; }
.slist { display: grid; gap: 2px; }
.srow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; font: inherit; color: inherit; }
.srow:hover { background: var(--paper-2); }
.srate { display: inline-grid; place-items: center; height: 26px; border-radius: 7px; font: 800 13px var(--display); color: #fff; }
.srow b { font-size: 13.5px; display: block; line-height: 1.25; }
.srow span.sub { font-size: 12px; color: var(--ink-2); }
.srow .dist { font: 500 12px var(--mono); color: var(--ink-2); text-align: right; white-space: nowrap; }
.sfacts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sfacts div { background: var(--paper-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 1px; }
.sfacts b { font: 800 18px var(--display); }
.sfacts span { font-size: 12px; color: var(--ink-2); line-height: 1.25; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--pine); }
.outcome { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 13.5px; }
.sgroup { font: 500 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 6px 0 2px; }
.school-card .big { font: 800 40px/1 var(--display); }
@media (max-width: 820px) {
  #bar { padding: 8px; gap: 8px; }
  .brand h1 { font-size: 19px; } #people span { display: none; }
  #modes { order: 3; width: 100%; }
  #rail, #card { top: auto; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); left: 8px; right: 8px; width: auto; max-height: 52%; }
  #sheet { top: calc(112px + env(safe-area-inset-top, 0px)); max-height: calc(100% - 128px); }
  #mobilebar { display: flex; position: fixed; z-index: 10; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); gap: 6px; padding: 6px; }
  #furniture { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); right: 10px; }
  #scalebar, #light { display: none; }
  #tour { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .facts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .keyturn { transition: none; } }
</style>

<div id="stage"></div>
<div id="loading"><div class="box"><b style="font: 800 22px var(--display)">Two Keys</b><span id="load-msg">Loading the city…</span><span class="bar2"><i id="load-bar"></i></span></div></div>

<header id="bar" class="glass">
  <div class="brand"><svg viewBox="0 0 40 26" aria-hidden="true"><g fill="none" stroke="var(--brass)" stroke-width="2.4" stroke-linecap="round"><circle cx="8" cy="8" r="5"/><path d="M12 11l9 9m-3-3l3-3m0 6l2-2"/><circle cx="32" cy="8" r="5" stroke="var(--pine)"/><path d="M28 11l-9 9m3-3l-3-3" stroke="var(--pine)"/></g></svg><h1>Two Keys</h1></div>
  <nav id="modes" aria-label="Modes">
    <button data-mode="explore" aria-pressed="true">Explore</button>
    <button data-mode="tour" class="homes-only">Tour <span class="count" id="c-tour"></span></button>
    <button data-mode="picks" class="homes-only">Our picks <span class="count" id="c-picks"></span></button>
    <button data-mode="prio" class="homes-only">What matters</button>
    <button data-mode="report" class="homes-only">Report</button>
  </nav>
  <div id="people" class="homes-only"></div>
</header>

<aside id="rail" class="glass" aria-label="Map controls">
  <div class="homes-only"><span class="lab">Colour homes by</span><div class="lenses" id="lenses"></div></div>
  <div class="legend" id="legend"></div>
  <div class="homes-only"><span class="lab">Show</span><div class="chips" id="types"></div></div>
  <div class="homes-only"><label class="lab" for="f-max">Max price</label><input type="number" id="f-max" step="25000" min="300000"></div>
  <div><span class="lab">Layers</span><div style="display:grid;gap:5px">
    <label class="check"><input type="checkbox" id="l-bld" checked> 3D buildings</label>
    <label class="check"><input type="checkbox" id="l-walk" checked> Walkability glow</label>
    <label class="check"><input type="checkbox" id="l-sch" checked> Schools</label>
    <label class="check"><input type="checkbox" id="l-sky" checked> SkyTrain</label>
    <label class="check"><input type="checkbox" id="l-lbl" checked> Labels</label>
    <label class="check homes-only"><input type="checkbox" id="l-pass"> Show homes we passed on</label></div></div>
  <div class="homes-only"><span class="lab" id="top-title">Best for us</span><div class="toplist" id="top"></div></div>
